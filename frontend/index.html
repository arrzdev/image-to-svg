<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>image → svg · version tester</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>image → svg</h1>
  <div class="controls">
    <label>Image <select id="image"></select></label>
    <label>Version <select id="version"></select></label>
    <button id="run">Run</button>
    <span id="status"></span>
  </div>
</header>

<main id="panels" hidden>
  <section>
    <h2>Original</h2>
    <div class="canvas" id="original"></div>
  </section>
  <section>
    <h2>Output <span id="meta"></span></h2>
    <div class="canvas" id="output"></div>
  </section>
  <section id="targetPanel">
    <h2>Target (Recraft)</h2>
    <div class="canvas" id="target"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
