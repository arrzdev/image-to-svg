<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>image → svg · version tester</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="tabs">
  <button class="tab active" data-tab="tester">Version tester</button>
  <button class="tab" data-tab="edgelab">Edge Lab</button>
</nav>

<div id="tab-tester">
<header>
  <h1>image → svg</h1>
  <div class="controls">
    <label>Image <select id="image"></select></label>
    <label>Version <select id="version"></select></label>
    <button id="run">Run</button>
    <span id="status"></span>
  </div>
</header>

<main id="panels" hidden>
  <section>
    <h2>Original</h2>
    <div class="canvas" id="original"></div>
  </section>
  <section>
    <h2>Output <span id="meta"></span></h2>
    <div class="canvas" id="output"></div>
  </section>
  <section id="targetPanel">
    <h2>Target (Recraft) <span id="targetMeta"></span></h2>
    <div class="canvas" id="target"></div>
  </section>
</main>
</div>

<div id="tab-edgelab" hidden>
<header>
  <h1>edge lab <span class="sub">boundary-first playground (edge-1): detect → join → bucket-fill</span></h1>
  <div class="controls">
    <label>Image <select id="el-image"></select></label>
    <label>Resolution
      <select id="el-dim">
        <option>768</option><option>1024</option>
        <option selected>1536</option><option>2048</option>
      </select>
    </label>
    <label>Pre-filter
      <select id="el-pre">
        <option value="none" selected>none</option>
        <option value="gaussian">gaussian</option>
        <option value="bilateral">bilateral</option>
      </select>
    </label>
    <label>strength <input type="range" id="el-prestr" min="1" max="8" value="3">
      <span class="val" id="el-prestr-v">3</span></label>
    <label>ΔE threshold <input type="range" id="el-thr" min="3" max="40" value="14">
      <span class="val" id="el-thr-v">14</span></label>
    <label>Join (close px)
      <select id="el-close">
        <option value="0">off</option><option value="3" selected>3</option>
        <option value="5">5</option><option value="7">7</option>
      </select>
    </label>
    <label>Min cell px <input type="range" id="el-mincell" min="0" max="600" step="20" value="0">
      <span class="val" id="el-mincell-v">0</span></label>
    <label>SVG simplify px <input type="range" id="el-eps" min="0" max="4" step="0.5" value="1.5">
      <span class="val" id="el-eps-v">1.5</span></label>
    <button id="el-run">Run</button>
    <label class="auto"><input type="checkbox" id="el-auto" checked> auto-run</label>
    <span id="el-status"></span>
  </div>
</header>

<main id="el-panels" hidden>
  <section>
    <h2>Original</h2>
    <div class="canvas" id="el-original"></div>
  </section>
  <section>
    <h2>1 · Edges (joined)</h2>
    <div class="canvas" id="el-edges"></div>
  </section>
  <section>
    <h2>2 · Bucket fills</h2>
    <div class="canvas" id="el-fills"></div>
  </section>
  <section>
    <h2>3 · Composite (fills + ink)</h2>
    <div class="canvas" id="el-composite"></div>
  </section>
  <section>
    <h2>4 · SVG — one path per cell <span id="el-svgmeta"></span></h2>
    <div class="canvas" id="el-svg"></div>
  </section>
</main>
</div>

<script src="app.js"></script>
</body>
</html>
